[package]
name = "nabungo-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "nabungo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
nabungo-app = { version = "0.1.0", path = "../crates/app" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
specta = "=2.0.0-rc.25"
specta-typescript = "0.0.12"
tauri = { version = "2.12.3", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
