name: Release

# Installer Linux + Windows, cek ukuran (< 15 MB), firewall test (0 paket keluar), dan draft
# GitHub Release saat tag v* di-push. Publish draft dilakukan manual.
# pull_request: workflow ini ikut teruji saat dependensi atau konfigurasi bundle berubah.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/**
      - src-tauri/tauri.conf.json
      - src-tauri/Cargo.toml
      - Cargo.toml
      - Cargo.lock

jobs:
  version:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-version.mjs "${{ github.ref_type == 'tag' && github.ref_name || '' }}"

  bundle:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04: glibc lebih tua agar deb/AppImage jalan di distro yang lebih lama.
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build installer (Linux)
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: pnpm tauri build --bundles appimage,deb,rpm
      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        run: pnpm tauri build --bundles nsis,msi
      - run: node scripts/check-bundle-size.mjs target/release/bundle
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ runner.os }}
          if-no-files-found: error
          path: |
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.rpm
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.msi
            target/release/bundle/**/*-setup.exe
      - name: Build seed_fixture (Linux, untuk firewall test)
        if: runner.os == 'Linux'
        run: cargo build -p nabungo-app --release --example seed_fixture
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: fw-bins
          if-no-files-found: error
          path: |
            target/release/nabungo-desktop
            target/release/examples/seed_fixture

  firewall:
    needs: bundle
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y tcpdump xvfb dbus-x11 libwebkit2gtk-4.1-0 libssl3
      - uses: actions/download-artifact@v4
        with:
          name: fw-bins
          path: fw-bins
      - run: chmod +x fw-bins/nabungo-desktop fw-bins/examples/seed_fixture
      - name: Self-test (harus menangkap paket DNS, exit 1)
        run: |
          set +e
          FW_SELFTEST=1 scripts/firewall-test.sh fw-bins/nabungo-desktop fw-bins/examples/seed_fixture
          code=$?
          if [ "$code" -ne 1 ]; then echo "self-test harus exit 1, dapat $code"; exit 1; fi
      - name: Firewall test (0 paket)
        run: scripts/firewall-test.sh fw-bins/nabungo-desktop fw-bins/examples/seed_fixture

  release:
    needs: [version, bundle, firewall]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: dist
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find dist -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.msi' -o -name '*-setup.exe' \))
          (cd dist && find . -type f -printf '%P\n' | xargs -d '\n' sha256sum) > SHA256SUMS
          sed -i 's#  .*/#  #' SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --draft --title "Nabungo ${GITHUB_REF_NAME#v}" \
            --notes-file docs/release/notes.md --generate-notes "${files[@]}" SHA256SUMS
