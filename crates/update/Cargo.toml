[package]
name = "nabungo-update"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# native-tls + root CA sistem: OpenSSL / SChannel yang sudah dipakai nabungo-mail (tanpa rustls
# dan tanpa bundel root CA tambahan).
ureq = { version = "3.1", default-features = false, features = ["native-tls-no-default"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
thiserror = "2.0.21"
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3"
