[package]
name = "nabungo-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
nabungo-core = { version = "0.1.0", path = "../core" }
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
rusqlite_migration = "2.6.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting"] }
uuid = { version = "1.28.0", features = ["v7"] }

[dev-dependencies]
tempfile = "3"
time = { version = "0.3.55", features = ["macros"] }
