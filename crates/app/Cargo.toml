[package]
name = "nabungo-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
nabungo-core = { version = "0.1.0", path = "../core" }
nabungo-storage = { version = "0.1.0", path = "../storage" }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "local-offset", "macros", "parsing"] }
csv = "1.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
uuid = "1.28.0"

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3"
time = { version = "0.3.55", features = ["macros"] }
