[package]
name = "nabungo-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
nabungo-core = { version = "0.3.0", path = "../core" }
nabungo-storage = { version = "0.3.0", path = "../storage" }
nabungo-mail = { version = "0.3.0", path = "../mail" }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "local-offset", "macros", "parsing"] }
csv = "1.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tracing = "0.1.44"
uuid = "1.28.0"
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
base32 = "0.5.1"
base64 = "0.23.1"
getrandom = "0.3"
zeroize = "1.9.1"
keyring-core = "1.0.1"

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "1.0.1", default-features = false, features = ["crypto-openssl"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1.1.0"

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3"
time = { version = "0.3.55", features = ["macros"] }
