[workspace]
resolver = "3"
members = ["crates/core", "crates/storage", "crates/app", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Installer < 15 MB (PRD §8). opt-level tetap default agar hasil benchmark Fase 8a berlaku.
[profile.release]
lto = true
codegen-units = 1
strip = true
